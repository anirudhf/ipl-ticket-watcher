name: Publish to npm

on:
  push:
    branches:
      - main # Or use 'master' or a release tag
    paths:
      - "package.json"
      - "src/**"
      - ".github/workflows/**"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://registry.npmjs.org/"

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.Git_token }}
